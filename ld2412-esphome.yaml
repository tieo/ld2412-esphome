esphome:
  name: ld2412-esphome

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: esp.local
  reboot_timeout: 0s

network:
  enable_high_performance: false

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80
  local: true

uart:
  id: ld2412_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

ld2412:
  uart_id: ld2412_uart

binary_sensor:
  - platform: ld2412
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2412
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    detection_distance:
      name: "Detection Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"
    light:
      name: "Light"
    gate_0:
